# The same checks as on the dev machine, so "green locally" means "green in CI".
# On main, the hosted project and the web host are updated from here only.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main halfway through migrations or a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Not a credential: the ref is part of the public Supabase URL. It must match
  # [remotes.production] in supabase/config.toml.
  SUPABASE_PROJECT_REF: kiywcqhicsesgknlwjyy

jobs:
  app:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the merge-commit check below can see the base branch.
          fetch-depth: 0
      # PR branches are brought up to date by rebasing onto main, never by
      # merging main into them; this required job blocks such a PR from merging.
      - name: Fail when the PR branch contains merge commits (rebase onto main instead)
        if: github.event_name == 'pull_request'
        run: |
          merges=$(git log --merges --oneline origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }})
          if [ -n "$merges" ]; then echo "$merges"; exit 1; fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci --coverage
      # Duration budgets run alone, after the parallel suite whose load makes them flaky.
      - run: npm run test:timing -- --ci

  db:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Services the pgTAP tests and type generation don't need are left out to save startup time.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,storage-api,supavisor
      - run: npx supabase test db
      - name: Fail when the generated database types are stale
        run: npm run db:types && git diff --exit-code src/types/database.ts

  e2e:
    name: E2E tests (web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The app needs auth, the REST API and the gateway; only tooling is left out.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,supavisor
      - run: npx supabase db reset
      - run: npx playwright install --with-deps chromium
      # Builds the web export with the local stack's values from .env.
      - run: npm run test:e2e
      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  hosted-config-diff:
    name: Hosted config diff (preview of what a merge pushes)
    # Fork PRs get no secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Secrets go only to the steps that need them, never to npm install scripts.
      - run: npx supabase config diff --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy:
    name: Migrate hosted database and deploy web
    needs: [app, db, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds the deploy secrets; restricted to main in the repository settings.
    environment: production
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://kiywcqhicsesgknlwjyy.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Secrets go only to the steps that need them, never to npm install scripts.
      # Runs before the config push: the hosted auth trusts small-quiz-poc.pages.dev,
      # so stop unless that domain really belongs to our Pages project.
      - name: Ensure the Cloudflare Pages project owns small-quiz-poc.pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler="npx -y wrangler@4.147.0"
          $wrangler pages project list --json | grep -q '"small-quiz-poc"' \
            || $wrangler pages project create small-quiz-poc --production-branch main
          $wrangler pages project list --json | grep -qF 'small-quiz-poc.pages.dev' \
            || { echo "Pages project small-quiz-poc did not get small-quiz-poc.pages.dev"; exit 1; }
      - name: Migrate the hosted database and push its config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase db push --yes
          npx supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes
      # The job's EXPO_PUBLIC_* variables take precedence over the local values in .env.
      - run: npx expo export --platform web
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.147.0 pages deploy dist --project-name small-quiz-poc --branch main
      - name: Smoke test that this build is live and the hosted database answers
        run: |
          entry=$(grep -o '_expo/static/js/web/entry-[0-9a-f]*\.js' dist/index.html)
          for attempt in 1 2 3 4 5 6; do
            curl -fsS https://small-quiz-poc.pages.dev/ | grep -qF "$entry" && break
            [ "$attempt" = 6 ] && { echo "https://small-quiz-poc.pages.dev/ does not serve $entry"; exit 1; }
            sleep 10
          done
          curl -fsS "https://small-quiz-poc.pages.dev/$entry" | grep -qF "$EXPO_PUBLIC_SUPABASE_URL"
          test "$(curl -fsS -X POST "$EXPO_PUBLIC_SUPABASE_URL/rest/v1/rpc/health_check" \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json')" = '"ok"'
