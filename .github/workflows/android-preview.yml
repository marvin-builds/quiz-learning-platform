# Builds the installable preview APK for the per-phase mobile smoke test
# (docs/mobile-smoke-test.md). Only by hand: `eas build --local` runs on this
# runner, so it uses no EAS build credits, and the hosted key stays a GitHub secret.
name: Android preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Holds the secrets; restricted to main in the repository settings.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      # Secrets go only to the step that needs them, never to npm install scripts.
      # The preview profile in eas.json sets the hosted URL; the committed .env holds
      # the local stack's 127.0.0.1, so it must not be loaded.
      - name: Build the APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          EXPO_NO_DOTENV: '1'
        run: |
          npx -y eas-cli@24.10.0 build --local -p android --profile preview \
            --non-interactive --output quiz-preview.apk
      - name: Check that the APK talks to the hosted backend, not the local stack
        run: |
          url=$(node -p "require('./eas.json').build.preview.env.EXPO_PUBLIC_SUPABASE_URL")
          unzip -p quiz-preview.apk assets/index.android.bundle > bundle
          grep -aqF "$url" bundle || { echo "The APK's bundle lacks $url"; exit 1; }
          # The local stack's URL from .env; a bare 127.0.0.1 is also in library code.
          if grep -aqF http://127.0.0.1:54321 bundle; then echo "The APK's bundle points at the local stack"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: quiz-preview-apk
          path: quiz-preview.apk
          if-no-files-found: error
